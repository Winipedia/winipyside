---
"name": "Health Check"
"on":
  "workflow_dispatch": {}
  "pull_request":
    "types":
      - "opened"
      - "synchronize"
      - "reopened"
  "schedule":
    -
      "cron": "0 1 * * *"
  "workflow_call": {}
"permissions": {}
"concurrency":
  "group": "Health Check-${{ github.ref }}"
  "cancel-in-progress": true
"run-name": "Health Check"
"jobs":
  "health-checks":
    "name": "Health Checks"
    "permissions":
      "contents": "read"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 60
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        # ryl disable-line rule:line-length
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        "with":
          "persist-credentials": false
      -
        "name": "Setup Package Manager"
        "id": "setup-package-manager"
        # ryl disable-line rule:line-length
        "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2"  # v10.3.3
        "with":
          "python-version": "3.13"
      -
        "name": "Update Dependencies"
        "id": "update-dependencies"
        "run": "uv lock --upgrade"
      -
        "name": "Install Dependencies"
        "id": "install-dependencies"
        "run": "uv sync"
      -
        "name": "Install Pyside System Dependencies"
        "id": "install-pyside-system-dependencies"
        "if": "runner.os == 'Linux'"
        "run": |-
          sudo \
            apt-get \
            update \
            && \
            sudo \
            apt-get \
            install \
            -y \
            libegl1 \
            libpulse0
      -
        "name": "Run Version Control Hooks"
        "id": "run-version-control-hooks"
        "run": "uv run prek run --all-files --group=all"
        "env":
          "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
  "matrix-health-checks":
    "name": "Matrix Health Checks"
    "permissions":
      "contents": "read"
    "runs-on": "${{ matrix.os }}"
    "timeout-minutes": 120
    "strategy":
      "matrix":
        "os":
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        "python-version":
          - "3.12"
          - "3.13"
      "fail-fast": true
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        # ryl disable-line rule:line-length
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        "with":
          "persist-credentials": false
      -
        "name": "Setup Package Manager"
        "id": "setup-package-manager"
        # ryl disable-line rule:line-length
        "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2"  # v10.3.3
        "with":
          "python-version": "${{ matrix.python-version }}"
      -
        "name": "Update Dependencies"
        "id": "update-dependencies"
        "run": "uv lock --upgrade"
      -
        "name": "Install Dependencies"
        "id": "install-dependencies"
        "run": "uv sync"
      -
        "name": "Install Pyside System Dependencies"
        "id": "install-pyside-system-dependencies"
        "if": "runner.os == 'Linux'"
        "run": |-
          sudo \
            apt-get \
            update \
            && \
            sudo \
            apt-get \
            install \
            -y \
            libegl1 \
            libpulse0
      -
        "name": "Run Tests"
        "id": "run-tests"
        "run": "uv run pytest"
        "env":
          "QT_QPA_PLATFORM": "offscreen"
          "QTWEBENGINE_DISABLE_SANDBOX": "1"
          "QTWEBENGINE_CHROMIUM_FLAGS": |-
            --no-sandbox \
              --disable-gpu \
              --disable-software-rasterizer \
              --disable-dev-shm-usage
  "code-analysis":
    "name": "Code Analysis"
    "permissions":
      "actions": "read"  # required
      "contents": "read"
      "security-events": "write"  # required
    "uses": "$/.github/workflows/code-analysis.yml"
  "health-check":
    "name": "Health Check"
    "needs":
      - "health-checks"
      - "matrix-health-checks"
      - "code-analysis"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 1
    "steps":
      -
        "name": "Aggregate Jobs"
        "id": "aggregate-jobs"
        "run": "echo 'Aggregating jobs into one job.'"
...
